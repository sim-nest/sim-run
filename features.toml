guidance = "Compose NativeBuilder with a boot-selected sim-lib-exec launcher and preopened source, target, and artifact mounts. Pass its ArtifactCandidate to AdmissionService with the selected LoaderPort, latest managed generation, exact dependency boot receipts, and explicit compatibility and test limits. Admission never loads or exercises the candidate in the live context."
