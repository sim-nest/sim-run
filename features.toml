[[feature]]
id = "feature/sim-run/deliver-command"
title = "Loadable deliver command"
summary = "Select world deliver and delegate the delivery record to sim-lib-world."
owner = "crate/sim-run"
audiences = ["user", "code", "framework"]
guidance = "Use sim world deliver with one realization. The bootloader contributes only the host factory and the world verb source. sim-lib-world owns the delivery record. A model catalog repeats and names its disclosure. Native and real realizations stay unavailable. A private realization or selector stays a gap. An unknown realization stays a gap. Status without an admitted record asks for a refresh. A missing realization stays on the world command."
claims_specimens = ["spec-test/sim-run/crates/sim-run/tests/deliver_gate"]
presents = ["feature/sim-runtime/world-projection-product"]

