schema = "sim.features"

[enforcement.audience]
user = "strict"
code = "strict"
framework = "advisory"

[enforcement.surface]
cli = "strict"
view = "strict"
syntax = "advisory"
wire = "advisory"
site = "advisory"
docs = "advisory"

[enforcement.specimen]
user = "strict"
framework = "strict"
code = "advisory"

[enforcement.route]
major_entrypoints = "advisory"
frameworks = "advisory"

[[feature]]
id = "feature/sim-run/physics-library-selection"
title = "Physics library boot selection"
summary = "Routes the physics verb through the ordinary host-library load session without embedding scientific behavior in the bootloader."
owner = "crate/sim-run"
audiences = ["user", "code", "framework"]
guidance = "Use sim physics to select lib/physics; Shapes, operations, methods, adapters, and providers remain owned outside the frame."
claims_specimens = ["spec-test/sim-run/crates/sim-run/tests/physics"]
composes = ["crate/sim-lib-physics-runtime", "crate/sim-run-core"]

[[feature]]
id = "feature/sim-run/index"
title = "Repository index contract"
summary = "Expose generated package, card, surface, and recipe facts as a checked SIM Index fragment."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this host-tool row when checking generated Index facts or standalone packaging evidence. It is structurally outside every product closure."
claims_anchors = [
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/sim-index-fragment",
]
claims_surfaces = [
  "cli/xtask",
  "docs/sim-run/generated",
]

[[feature]]
id = "feature/sim-run/bootloader"
title = "Bootloader command dispatch"
summary = "Start product commands through the shared bootloader and loaded runtime libraries."
owner = "crate/sim-run-core"
audiences = ["user", "code"]
guidance = "Feed boot_load_requests the platform-composed PureBootEnvelope. It preserves the explicit application/library load plan and performs no target, provider, registry, host, or fallback selection. Use generic codec/load/profile controls for behavior; the bootloader owns no language engine or platform policy. The optional artifact registry keeps its integrity and cache contract here while delegating generic blocking HTTP policy and framing to feature/sim-foundation/blocking-http-client."
claims_anchors = [
  "anchor/bin/sim",
  "anchor/cli/sim-run",
  "anchor/crate/sim-run",
  "anchor/crate/sim-run-core",
  "anchor/export/sim-run-core/codec/lisp",
  "anchor/export/sim-run/codec/lisp",
  "anchor/runtime-lib/sim-run/boot-codec",
  "anchor/rustdoc/sim-run-core/bootloader",
  "anchor/rustdoc/sim-run-core/run_with_session",
  "anchor/rustdoc/sim-run-core/run_supplied_bootstrap",
]
claims_surfaces = [
  "cli/sim-run",
  "site/sim-run-core",
]

[[feature]]
id = "feature/sim-run/study-command"
title = "Generic study command surface"
summary = "Dispatch the loadable study product through sim study without adding study behavior to the bootloader."
owner = "crate/sim-run"
audiences = ["user", "code"]
guidance = "Use sim study with an explicit graph and one of plan, seal, run, resume, cancel, status, show, verify, report, decide, select, or export. The bootloader only selects sim-lib-study and the boot codec; lifecycle, effects, reports, and decisions remain in the loaded library."
claims_specimens = ["spec-test/sim-run/crates/sim-run/src/study"]
supports = ["feature/sim-run/bootloader", "feature/sim-runtime/domain-free-study-lifecycle"]

[[route]]
id = "route/run-study-command"
task = "Run and inspect a generic study from the terminal"
audiences = ["user", "code"]
steps = [
  { feature = "feature/sim-run/bootloader", why = "The bootloader selects the study verb and loads its product library without acquiring study policy." },
  { feature = "feature/sim-runtime/domain-free-study-lifecycle", why = "The runtime library owns sealed coordinates, execution, evidence, reports, and decisions." },
  { feature = "feature/sim-run/study-command", why = "The command row wires the standard distribution to the loadable study surface." },
  { specimen = "spec-test/sim-run/crates/sim-run/src/study", why = "The checked handoff specimen covers verb selection and loadable-library dispatch." },
]

