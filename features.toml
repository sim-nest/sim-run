  { feature = "feature/sim-runtime/world-projection-product", why = "The world product owns the succession record and leaves the seal unclaimed." },
  { specimen = "spec-test/sim-run/crates/sim-run/tests/succession_gate", why = "The installed binary closes an independent change, repeats it, and keeps the construction specimen open." },
