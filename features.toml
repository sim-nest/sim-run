]
claims_specimens = [
  "recipe/sim-run/publish-readiness/package-list",
]

[[feature]]
id = "feature/sim-run/bootloader"
title = "Bootloader command dispatch"
summary = "Start product commands through the shared bootloader and loaded runtime libraries."
owner = "crate/sim-run-core"
audiences = ["user", "code"]
guidance = "Feed boot_load_requests the platform-composed PureBootEnvelope. It preserves the explicit application/library load plan and performs no target, provider, registry, host, or fallback selection. Use generic codec/load/profile controls for behavior; the bootloader owns no language engine or platform policy. The optional artifact registry keeps its integrity and cache contract here while delegating generic blocking HTTP policy and framing to feature/sim-foundation/blocking-http-client."
claims_anchors = [
  "anchor/cli/sim-run",
  "anchor/crate/sim-run",
  "anchor/crate/sim-run-core",
  "anchor/export/sim-run-core/codec/lisp",
  "anchor/export/sim-run/codec/lisp",
  "anchor/runtime-lib/sim-run/boot-codec",
  "anchor/rustdoc/sim-run-core/bootloader",
  "anchor/rustdoc/sim-run-core/run_with_session",
  "anchor/rustdoc/sim-run-core/run_supplied_bootstrap",
]
claims_surfaces = [
  "cli/sim-run",
  "site/sim-run-core",
]
claims_specimens = [
  "recipe/sim-run/01-basics/version",
  "recipe/sim-run/02-scenarios/boot-lisp-eval",
]

