frameworks = "advisory"

[[feature]]
id = "feature/sim-run/physics-library-selection"
title = "Physics library boot selection"
summary = "Routes the physics verb through the ordinary host-library load session without embedding scientific behavior in the bootloader."
owner = "crate/sim-run"
audiences = ["user", "code", "framework"]
guidance = "Use sim physics to select lib/physics; Shapes, operations, methods, adapters, and providers remain owned outside the frame."
claims_anchors = ["anchor/bin/sim"]
claims_specimens = ["spec-test/sim-run/crates/sim-run/tests/physics_selects_the_standard_bootloader_path"]
composes = ["feature/sim-physics/loadable-runtime-composition", "crate/sim-run-core"]

[[feature]]
id = "feature/sim-run/index"
title = "Repository index contract"
summary = "Expose generated package, card, surface, and recipe facts as a checked SIM Index fragment."
owner = "crate/xtask"
audiences = ["code"]
guidance = "Use this host-tool row when checking generated Index facts or standalone packaging evidence. It is structurally outside every product closure."
claims_anchors = [
  "anchor/cli/xtask",
  "anchor/crate/xtask",
  "anchor/doc/generated/feature-map",
  "anchor/doc/generated/sim-index-fragment",
]
claims_surfaces = [
