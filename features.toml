[[feature]]
id = "feature/sim-run/jvm-command"
title = "JVM product command"
summary = "Run caller-supplied classfile bytes, exact class, member, descriptor, and integer arguments through the host-registered JVM library and cli/main/jvm adapter."
owner = "crate/sim-run"
audiences = ["user", "code"]
guidance = "Invoke sim jvm HEX_CLASSFILE CLASS MEMBER DESCRIPTOR [I32 ...]. The binary selects host factories and capabilities, then the one sim-run-core bootloader loads sim-lib-lang-jvm and dispatches cli/main/jvm; it only parses the caller envelope and renders value, Java throwable, or refusal, and never constructs a Cx, reads an ambient classpath, or embeds JVM semantics."
claims_anchors = [
  "anchor/bin/sim",
  "anchor/cli/jvm",
  "anchor/export/sim-run/cli/main/jvm",
  "anchor/runtime-lib/sim-run/jvm-cli-lib",
]
claims_surfaces = ["cli/sim", "cli/jvm"]
claims_specimens = [
  "recipe/sim-run/02-scenarios/jvm-product",
  "spec-test/sim-run/crates/sim-run/tests/jvm_product",
]
presents = ["feature/sim-runtime/jvm-loadable-profile"]

[[route]]
id = "route/run-jvm-command"
task = "Run the JVM product specimen"
audiences = ["user", "code"]
steps = [
  { feature = "feature/sim-run/bootloader", why = "The standard bootloader owns the runtime session and verb handoff." },
  { feature = "feature/sim-run/jvm-command", why = "The JVM command contributes only host factories, capabilities, and the loadable CLI adapter." },
  { specimen = "recipe/sim-run/02-scenarios/jvm-product", why = "The runnable recipe enters through the published sim command." },
  { specimen = "spec-test/sim-run/crates/sim-run/tests/jvm_product", why = "The published sim binary loads authorized bytes and reports static, object, array, exception, and concat outcomes." },
]

