[[feature]]
id = "feature/sim-run/succession-command"
title = "Loadable succession commands"
summary = "Select world succeed and world fresh and delegate one exported change to sim-lib-world."
owner = "crate/sim-run"
audiences = ["user", "code", "framework"]
guidance = "Use sim world succeed and sim world fresh with one export and one later change. The bootloader contributes only the host factory and the world verb source. sim-lib-world owns the succession record. An independent change closes with no second-pass work and reports the seal unclaimed. The construction specimen stays a fresh gap. A warm checkout and a linux claim stay gaps."
claims_specimens = ["spec-test/sim-run/crates/sim-run/tests/succession_gate"]
presents = ["feature/sim-runtime/world-projection-product"]

