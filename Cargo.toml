[workspace]
resolver = "3"
members = [
  "crates/sim-run-core",
  "crates/sim-run-loaders",
  "crates/sim-lib-index",
  "crates/sim-lib-repl",
  "crates/sim-run",
  "crates/sim-view-tty",
  "xtask",
]
# The CLI stack -- sim-run (crates/sim-run) and sim-lib-repl -- depends on the
# `sim-nest` facade (imported as `sim`). Standalone checkouts resolve the facade
# from crates.io; crates in this repository remain local workspace members.

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sim-nest/sim-run"
homepage = "https://github.com/sim-nest/sim-run"

[workspace.lints.rust]
unsafe_code = "forbid"

# Published product libraries depend back on the bootloader crates.  Keep those
# dependencies on the workspace-owned identities in a standalone checkout so a
# local bootloader type can never coexist with a second crates.io copy.
[patch.crates-io]
sim-run-core = { path = "crates/sim-run-core" }
sim-run-loaders = { path = "crates/sim-run-loaders" }
