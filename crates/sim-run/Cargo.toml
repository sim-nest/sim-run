[package]
name = "sim-run"
version = "0.3.4"
edition.workspace = true
license.workspace = true
description = "SIM bootloader command line."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-run"
homepage = "https://github.com/sim-nest/sim-run"

[[bin]]
name = "sim"
path = "src/main.rs"

[features]
# Compose the native dynamic-library loader into the `sim` build. The default
# binary stays a thin bootloader (no loader but the in-process host loader); this
# feature pulls in the low loader crate so `sim --load path:lib.so` works without
# the SDK umbrella.
dynamic-native = [
  "dep:sim-run-loaders",
  "sim-run-loaders/dynamic-native",
  "dep:sim-lib-repl",
]
registry = ["sim-run-core/registry"]
wasm = [
  "dep:sim-run-loaders",
  "sim-run-loaders/wasm",
  "dep:sim-wasm-abi",
]

[dependencies]
sim-run-core = { version = "0.5.0", path = "../sim-run-core" }
sim-run-loaders = { version = "0.4.0", path = "../sim-run-loaders", optional = true, default-features = false }
sim-kernel = { version = "0.4.0" }
sim-lib-compute-auto = { version = "0.5.0" }
sim-lib-compute-cli = { version = "0.3.1" }
sim-lib-compute-model = { version = "0.5.0" }
sim-lib-expr-tree-serve = { version = "0.3.0" }
sim-lib-estate-book = { version = "0.2.0" }
sim-lib-estate-serve = { version = "0.2.0" }
sim-lib-index = { version = "0.4.2", path = "../sim-lib-index" }
sim-lib-study = { version = "0.2.0" }
sim-lib-model-test = { version = "0.2.0" }
sim-lib-roadmap = { version = "0.1.1" }
sim-lib-roadmap-runner = { version = "0.1.1" }
sim-lib-provider-cli = { version = "0.1.1" }
sim-lib-physics-runtime = { version = "0.1.1", features = ["full"] }
sim-lib-search = { version = "0.2.0" }
sim-lib-lang-jvm = { version = "0.2.1" }
sim-platform-core = { version = "0.2.0" }
sim-platform-model = { version = "0.1.0" }
sim-platform-ubuntu-pc = { version = "0.1.1" }
sha2 = { version = "0.10" }
sim-lib-repl = { version = "0.4.1", path = "../sim-lib-repl", optional = true }
sim-lib-relation-cli = { version = "0.1.1" }
sim-wasm-abi = { version = "0.5.0", optional = true }

[dev-dependencies]
sim-codec = { version = "0.3.0" }
sim-kernel = { version = "0.4.0", features = ["test-support"] }
wat = "1.245.1"

[lints]
workspace = true
