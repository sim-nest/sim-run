[package]
name = "sim-lib-index"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Loadable SIM Index exploration library for the sim bootloader."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-run"
homepage = "https://github.com/sim-nest/sim-run"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sim-codec-index = { version = "0.2.1" }
sim-index-core = { version = "0.2.0" }
sim-kernel = { version = "0.2.0" }
sim-run-core = { version = "0.3.0", path = "../sim-run-core" }

[lints]
workspace = true
