[package]
name = "sim-lib-hotload"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Structured offline sandboxed native library builds for SIM."
readme = "README.md"
publish = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim-kernel = { version = "0.2.1", path = "../../../sim-kernel" }
sim-lib-exec = { version = "0.2.0", path = "../../../sim-runtime/crates/sim-lib-exec" }
sim-lib-journal = { version = "0.1.0", path = "../../../sim-storage/crates/sim-lib-journal" }
sim-run-loaders = { version = "0.2.0", path = "../sim-run-loaders" }
sim-storage-port = { version = "0.1.0", path = "../../../sim-storage/crates/sim-storage-port" }
toml = "0.8"

[lints]
workspace = true
