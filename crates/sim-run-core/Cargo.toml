[package]
name = "sim-run-core"
version = "0.3.2"
edition.workspace = true
license.workspace = true
description = "Core command entry API for the SIM bootloader."
readme = "README.md"
publish = true
repository = "https://github.com/sim-nest/sim-run"
homepage = "https://github.com/sim-nest/sim-run"

[dependencies]
sim-codec-config = { version = "0.1.2" }
sim-config = { version = "0.1.1" }
sim-kernel = { version = "0.2.1" }
sim-lib-net-http = { version = "0.1.0" }
sim-lib-stream-host = { version = "0.1.7" }
sim-platform-bootstrap = { version = "0.1.0" }
sim-platform-core = { version = "0.1.0" }
sim-run-loaders = { version = "0.2.0", path = "../sim-run-loaders", default-features = false }
sha2 = { version = "0.10", optional = true }

[features]
default = []
registry = ["dep:sha2"]

[dev-dependencies]
sim-view-tty = { version = "0.1.3", path = "../sim-view-tty" }

[lints]
workspace = true
